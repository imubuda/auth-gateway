name: My Workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Print environment
        run: echo $GITHUB_ENV
      - name: Print environment variables
        run: echo ${{ secrets.GITHUB_TOKEN }}
      - name: Print a message
        run: echo "Hello, World!"